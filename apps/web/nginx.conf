# =============================================================================
# Nginx Configuration -- Modular House Web Frontend
# =============================================================================
# Production-ready configuration for a Vite-built, pre-rendered SPA served
# behind a Traefik reverse-proxy.
#
# Key concerns addressed:
#   1. Correct MIME types for all static asset formats (SVG, WOFF2, etc.).
#   2. Aggressive caching for fingerprinted Vite assets; short cache for HTML.
#   3. SPA fallback via try_files so client-side routing works on hard reload.
#   4. Gzip compression to reduce transfer size.
#   5. Trailing slash normalization with 301 redirects for SEO consistency.
# =============================================================================

# ------------------------------------------------------------------
# Client-facing scheme resolution
# Traefik terminates TLS at the edge and always forwards decrypted
# traffic to this container over plain HTTP, so nginx's own $scheme
# is unconditionally "http" -- even when the visitor connected over
# HTTPS. Any `rewrite ... permanent` below that let nginx prepend its
# own $scheme would therefore emit "http://" Location headers for
# HTTPS visitors, forcing an extra http->https round trip through
# Traefik (visible as a 307 "Internal Redirect" in Chrome once HSTS
# kicks in) before the final page loads. Trust the X-Forwarded-Proto
# header Traefik sets on every proxied request instead, falling back
# to $scheme only for direct/local access (e.g. hitting the container
# without Traefik in front).
# ------------------------------------------------------------------
map $http_x_forwarded_proto $external_scheme {
    default $scheme;
    https   https;
    http    http;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ------------------------------------------------------------------
    # Trailing slash normalization
    # Redirects any URL ending with a trailing slash (except root '/') to
    # the canonical version without the trailing slash. This prevents
    # duplicate content issues and ensures consistency with the canonical
    # URLs declared in routes-metadata.ts.
    #
    # Examples:
    #   /garden-room/  -> /garden-room   (301 redirect)
    #   /contact/      -> /contact       (301 redirect)
    #   /              -> /              (no redirect, root is exempt)
    #
    # The 301 status code signals to search engines that this is a
    # permanent redirect, consolidating link equity to the canonical URL.
    # ------------------------------------------------------------------
    rewrite ^/(.+)/$ $external_scheme://$host/$1 permanent;

    # ------------------------------------------------------------------
    # Singular-to-plural canonical redirect
    # The canonical product page URL is /garden-rooms (plural). Redirect
    # the singular form and its sub-routes with a 301 so search engines
    # consolidate link equity to the canonical URLs. This is the server-
    # side counterpart of the React Router <Navigate> redirects in App.tsx
    # and ensures bots that do not execute JavaScript are still redirected.
    #
    # Examples:
    #   /garden-room                     -> /garden-rooms
    #   /garden-room/configure/compact-15 -> /garden-rooms/configure/compact-15
    # ------------------------------------------------------------------
    rewrite ^/garden-room(/.*)?$ $external_scheme://$host/garden-rooms$1 permanent;

    # ------------------------------------------------------------------
    # Singular-to-plural canonical redirect for house extensions
    # The canonical URL is /house-extensions (plural). This server-side
    # 301 redirect mirrors the React Router <Navigate> in App.tsx,
    # ensuring bots that do not execute JavaScript are still redirected.
    # Sub-route matching (/.*)?$ is included for consistency with the
    # garden-room rewrite pattern and to support future sub-routes.
    # ------------------------------------------------------------------
    rewrite ^/house-extension(/.*)?$ $external_scheme://$host/house-extensions$1 permanent;

    # ------------------------------------------------------------------
    # Gzip compression
    # Reduces transfer size for text-based assets served to the browser.
    # Binary formats (images, fonts) are already compressed and excluded.
    # ------------------------------------------------------------------
    gzip on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # ------------------------------------------------------------------
    # Fingerprinted assets produced by Vite (JS, CSS, images, fonts).
    # These file names contain a content hash, making them safe to cache
    # indefinitely. The browser will fetch a new URL when content changes.
    # ------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ------------------------------------------------------------------
    # Favicon and static image files in the document root.
    # A moderate cache lifetime avoids repeated round-trips while still
    # allowing updates within a reasonable window.
    # ------------------------------------------------------------------
    location ~* \.(?:ico|png|svg|webp|jpg|jpeg|gif)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ------------------------------------------------------------------
    # Font files (WOFF, WOFF2, TTF, OTF, EOT).
    # Fonts rarely change and are safe to cache aggressively.
    # ------------------------------------------------------------------
    location ~* \.(?:woff2?|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ------------------------------------------------------------------
    # SPA fallback
    # For any request that does not match a physical file or directory,
    # serve index.html so that React Router can handle the route on the
    # client. Pre-rendered routes already have their own index.html files
    # which will be matched first by try_files.
    #
    # IMPORTANT: The try_files directive uses $uri/index.html instead of
    # $uri/ to prevent nginx from issuing an automatic 301 redirect when
    # encountering a directory. Combined with the trailing slash rewrite
    # rule above, using $uri/ would create a redirect loop:
    #   /garden-room -> 301 /garden-room/ (nginx directory redirect)
    #   /garden-room/ -> 301 /garden-room (our rewrite rule)
    #
    # REAL 404s, NOT SOFT 404s:
    # The catch-all "*" route (NotFound.tsx) is not pre-rendered, so an
    # unknown path has no physical file for try_files to find. Falling
    # back straight to "/index.html" would serve that shell with a 200,
    # which search engines flag as a soft 404 (the URL "succeeds" while
    # the page says otherwise). Instead, try_files exhausts to =404, and
    # error_page reissues that request internally as /index.html so
    # React Router still renders the NotFound page -- but "=404" pins
    # the response status to 404 regardless of the fact that /index.html
    # itself opens successfully (a bare "=" would let the reissued
    # request's own outcome win, i.e. 200, which is the soft-404 bug
    # this exists to avoid). Scoped to this location only, so genuine
    # missing assets/images/fonts in the sibling location blocks below
    # still 404 normally instead of being rewritten into the SPA shell.
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/index.html =404;
        error_page 404 =404 /index.html;

        # HTML documents must not be cached aggressively because they
        # reference fingerprinted asset URLs that change on each deploy.
        location ~* \.html$ {
            add_header Cache-Control "no-cache";
        }
    }
}
